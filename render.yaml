services:
  - type: web
    name: futureme-ai
    env: node
    plan: free
    buildCommand: "cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install"
    startCommand: "cd backend && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: futureme-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: futureme-db
    plan: free
    postgresMajorVersion: 16
